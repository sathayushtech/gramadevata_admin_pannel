<form #contactForm="ngForm" (ngSubmit)="sendEmail(contactForm.value)">

  <input 
    type="text" 
    name="name" 
    ngModel 
    required 
    placeholder="Your Name"
  />

  <br><br>

  <input 
    type="email" 
    name="email" 
    ngModel 
    required 
    placeholder="Your Email"
  />

  <br><br>

  <textarea 
    name="message" 
    ngModel 
    required 
    placeholder="Your Message"
  ></textarea>

  <br><br>

  <button type="submit">
    Send Message
  </button>

</form>
